# Not on any supported ATS (checked): Maxar, Hexagon, Stantec, WSP, Carto, Ecopia, Felt,
# Overture Maps, Wherobots, Bentley Systems, Safe Software. Add them as career sites below
# once you have verified that the page exposes JSON-LD or job links.

# ---------------------------------------------------------------------------- job boards (search pages)
# Boards with neither an API nor a feed: the bot reads the search page, follows the links that match
# job_url_pattern and extracts each posting's JSON-LD (robots.txt honoured, pages cached 7 days).
# source_type = "feed" marks a board rather than an employer page: the board's name is never used
# as the employer and its postings carry feed (not employer) authority in fusion.
# geospatial = false: generic titles such as "Ingénieur" need geospatial evidence in the posting.
# Keejob (Tunisia) had no SIG postings on 2026-09-16; the searches are cheap and catch new ones.

[[career_sites]]
name = "Keejob (SIG)"
url = "https://www.keejob.com/offres-emploi/?keywords=SIG"
source_type = "feed"
geospatial = false
job_url_pattern = 'keejob\.com/offres-emploi/\d+/'
use_robots_sitemaps = false
max_pages = 20

