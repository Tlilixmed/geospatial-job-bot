name: Telegram commands

# Executes messages you send the bot (/help lists the commands). Two ways in:
#  * webhook (recommended): the Cloudflare Worker in cloudflare/ receives each message instantly and
#    dispatches this workflow with the text, so you get a reply in about a minute and nothing runs when
#    you are silent. After deploying it, set the repository variable TELEGRAM_WEBHOOK=true: scheduled
#    polls are then skipped (a skipped job bills no minutes).
#  * polling: without the Worker this workflow polls Telegram hourly. Each poll bills about one minute
#    (private repositories get 2,000 a month); on a public repository "*/10 * * * *" is fine.
# The scraper also processes pending messages at the start of every run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      inbox:
        description: "true = read the message(s) the Cloudflare Worker left in R2 under inbox/ (private hand-over)"
        required: false
        default: ""
      text:
        description: "Message to execute when the Worker has no R2 binding (visible in the run on a public repo)"
        required: false
        default: ""
      hint:
        description: "Optional AI reading of the message, supplied by the Worker"
        required: false
        default: ""

concurrency:
  group: geospatial-job-commands
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets /run start the scraper workflow

jobs:
  commands:
    if: ${{ github.event_name != 'schedule' || vars.TELEGRAM_WEBHOOK != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Process Telegram commands
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          PREFERRED_LOCATIONS: ${{ vars.PREFERRED_LOCATIONS }}
          AI_MODELS: ${{ vars.AI_MODELS }}
          MY_LANGUAGES: ${{ vars.MY_LANGUAGES }}
          MY_SKILLS: ${{ vars.MY_SKILLS }}
          HOME_COUNTRIES: ${{ vars.HOME_COUNTRIES }}
          # passed through the environment, never interpolated into the shell
          COMMAND_INBOX: ${{ inputs.inbox }}
          COMMAND_TEXT: ${{ inputs.text }}
          COMMAND_HINT: ${{ inputs.hint }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_R2: "true"
        run: python -m geojobbot commands
