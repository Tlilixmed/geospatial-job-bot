name: Geospatial job scraper

on:
  schedule:
    - cron: "0 */2 * * *"   # quota-bound sources keep their own 4-12 h minimum interval
  push:
    branches: [main]   # every push runs the bot once on the new code (the concurrency group prevents overlap)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending, and do not write state"
        type: boolean
        default: false

concurrency:
  group: geospatial-job-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # "Re-run jobs" replays the commit the original run was created from, not the current main.
      # Fail fast in that case so a stale run never masquerades as a run of the latest code.
      - name: Refuse to replay stale code
        run: |
          latest=$(git ls-remote --quiet origin refs/heads/main | cut -f1)
          echo "running commit ${GITHUB_SHA:0:7}; main is at ${latest:0:7}"
          if [ -n "$latest" ] && [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::This run replays old commit ${GITHUB_SHA:0:7} while main is at ${latest:0:7}. Use Actions -> Run workflow (or wait for the schedule) instead of 'Re-run jobs'."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt || echo "::warning::python-jobspy failed to install; JobSpy backend will be skipped"

      - name: Run bot
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FRANCETRAVAIL_CLIENT_ID: ${{ secrets.FRANCETRAVAIL_CLIENT_ID }}
          FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
          # Repository variables override these defaults (Settings -> Secrets and variables -> Actions -> Variables)
          # No preferred location by default: any country is fine when the employer sponsors, and postings that
          # demand existing work authorisation are rejected by the matcher (HOME_COUNTRIES exempts Tunisia).
          PREFERRED_LOCATIONS: ${{ vars.PREFERRED_LOCATIONS }}
          ACCEPTED_REMOTE_SCOPES: ${{ vars.ACCEPTED_REMOTE_SCOPES || 'Worldwide,EMEA,Africa,MENA,Middle East,Europe,Americas' }}
          JOBSPY_SITES: ${{ vars.JOBSPY_SITES || 'indeed,linkedin' }}
          # three of these are searched per run, in rotation (JOBSPY_LOCATIONS_PER_RUN)
          JOBSPY_LOCATIONS: ${{ vars.JOBSPY_LOCATIONS || 'Remote@usa,Canada@canada,Tunisia@worldwide,France@france,United Arab Emirates@united arab emirates,Saudi Arabia@saudi arabia,Qatar@qatar,Belgium@belgium,Switzerland@switzerland,Germany@germany,Australia@australia,United Kingdom@uk,Morocco@morocco' }}
          JOOBLE_LOCATIONS: ${{ vars.JOOBLE_LOCATIONS || 'Canada,Tunisia,France,Belgium,Switzerland,United Arab Emirates,Saudi Arabia,Qatar,Morocco' }}
          ADZUNA_COUNTRIES: ${{ vars.ADZUNA_COUNTRIES || 'ca,fr,gb,us,de,be,ch,nl,au,at' }}
          ALERT_FORMAT: ${{ vars.ALERT_FORMAT || 'digest' }}
          # alerts carry High matches only; Possible ones stay one message away (/jobs, /range, /possible on)
          NOTIFY_POSSIBLE: ${{ vars.NOTIFY_POSSIBLE || 'false' }}
          DUCKDUCKGO_ENABLED: ${{ vars.DUCKDUCKGO_ENABLED || 'false' }}
          BOT_USER_AGENT: ${{ vars.BOT_USER_AGENT }}
          REQUIRE_R2: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          RUN_TIME_BUDGET_MINUTES: "45"
        run: python -m geojobbot run

      - name: Tell Telegram the run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             --data-urlencode text="❌ Geospatial job bot: run #${GITHUB_RUN_NUMBER} failed. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
